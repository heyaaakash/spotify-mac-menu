name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      SPOTMENU_REGISTER_APP: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Environment and shell syntax
        run: |
          sw_vers
          swift --version
          xcrun --show-sdk-version
          test "$(uname -m)" = "${{ matrix.arch }}"
          for script in Scripts/*.sh; do zsh -n "$script"; done
      - name: Regression checks
        run: ./Scripts/test.sh
      - name: Package and verify app
        run: |
          ./Scripts/package.sh
          test "$(lipo -archs dist/SpotMenu.app/Contents/MacOS/SpotMenu)" = "${{ matrix.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spotmenu-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/SpotMenu-*.zip
            dist/SpotMenu-*.sha256
          if-no-files-found: error
          retention-days: 14
