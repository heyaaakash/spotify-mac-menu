# Runs only after an explicit dispatch for an existing immutable version tag.
# Creates a DRAFT release; final publication remains a separate owner action.
name: Prepare draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching VERSION, for example v1.3.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SPOTMENU_REGISTER_APP: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable tag, version, and architecture
        run: |
          test "v$(cat VERSION)" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Test and package
        run: |
          ./Scripts/test.sh
          ./Scripts/package.sh
          test "$(lipo -archs dist/SpotMenu.app/Contents/MacOS/SpotMenu)" = "${{ matrix.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/SpotMenu-*.zip
            dist/SpotMenu-*.sha256
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Fetch artifacts and create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "v$(cat VERSION)" = "$RELEASE_TAG"
          gh run download "$GITHUB_RUN_ID" --name release-arm64 --dir release
          gh run download "$GITHUB_RUN_ID" --name release-x86_64 --dir release
          cd release
          test -f "SpotMenu-$(cat "$GITHUB_WORKSPACE/VERSION")-macos-arm64.zip"
          test -f "SpotMenu-$(cat "$GITHUB_WORKSPACE/VERSION")-macos-x86_64.zip"
          sha256sum -c ./*.sha256
          sha256sum ./*.zip > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./*.zip SHA256SUMS.txt \
            --draft --verify-tag --title "SpotMenu $RELEASE_TAG" \
            --notes-file "$GITHUB_WORKSPACE/Docs/RELEASE_NOTES.md"
